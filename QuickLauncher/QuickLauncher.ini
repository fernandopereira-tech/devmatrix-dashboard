
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=15,18,17,230
AlwaysOnTop=2
Draggable=1
SnapEdges=1
KeepOnScreen=1
@include=#ROOTCONFIGPATH#@Resources\Variables.inc

[Metadata]
Name=DevMatrix Quick Launcher
Author=Moosha Corp
Information=Launcher flutuante de aplicativos do DevMatrix Dashboard
Version=1.0

[Variables]
LauncherWidth=72
LauncherHeight=280

; ==========================================
; PAINEL
; ==========================================

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,#LauncherWidth#,#LauncherHeight#,8 | Fill Color 15,18,17,230 | StrokeWidth 1 | Stroke Color 0,255,102,100

; ==========================================
; CABEÇALHO
; ==========================================

[MeterTitle]
Meter=String
X=36
Y=8
W=40
H=20
FontFace=#FontFace#
FontSize=10
FontColor=#AccentColor#
StringAlign=Center
Text=DM
AntiAlias=1

[MeterClose]
Meter=String
X=58
Y=8
W=12
H=18
FontFace=#FontFace#
FontSize=11
FontColor=#MutedColor#
StringAlign=Center
Text=X
AntiAlias=1
LeftMouseUpAction=[!DeactivateConfig "DevMatrixDashboard\QuickLauncher"]

; ==========================================
; ÁREA DOS ATALHOS
; ==========================================

[MeterVSCode]
Meter=String
X=36
Y=48
W=56
H=40
FontFace=#FontFace#
FontSize=18
FontColor=#FontColor#
StringAlign=Center
Text=</>
AntiAlias=1
ToolTipText=Visual Studio Code
LeftMouseUpAction=["#VSCodePath#"]

[MeterPostman]
Meter=String
X=36
Y=98
W=56
H=40
FontFace=#FontFace#
FontSize=18
FontColor=#FontColor#
StringAlign=Center
Text=P
AntiAlias=1
ToolTipText=Postman
LeftMouseUpAction=["#PostmanPath#"]

[MeterOBS]
Meter=String
X=36
Y=148
W=56
H=40
FontFace=#FontFace#
FontSize=18
FontColor=#FontColor#
StringAlign=Center
Text=O
AntiAlias=1
ToolTipText=OBS Studio
LeftMouseUpAction=["#OBSPath#"]

[MeterCalculator]
Meter=String
X=36
Y=198
W=56
H=40
FontFace=#FontFace#
FontSize=18
FontColor=#FontColor#
StringAlign=Center
Text=+
AntiAlias=1
ToolTipText=Calculadora
LeftMouseUpAction=["#CalculatorPath#"]
