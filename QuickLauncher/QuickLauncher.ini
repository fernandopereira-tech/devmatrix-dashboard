
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=1
AlwaysOnTop=2
Draggable=1
SnapEdges=1
KeepOnScreen=1
@include=#ROOTCONFIGPATH#@Resources\Variables.inc

[Metadata]
Name=DevMatrix Quick Launcher
Author=Moosha Corp
Information=Launcher flutuante de aplicativos do DevMatrix Dashboard
Version=1.2

[Variables]
LauncherWidth=112
LauncherHeight=224
IconSize=32
IconX=40

; ==========================================
; PAINEL
; ==========================================

[MeterPanel]
Meter=Shape
Shape=Rectangle 2,0,#LauncherWidth#,#LauncherHeight#,12 | Fill Color 15,18,17,230 | StrokeWidth 1 | Stroke Color 0,255,102,100

; ==========================================
; CABEÇALHO
; ==========================================

[MeterTitle]
Meter=String
X=56
Y=8
W=96
H=20
FontFace=#FontFace#
FontSize=9
FontColor=#AccentColor#
StringAlign=Center
Text=DevMatrix
AntiAlias=1

[MeterClose]
Meter=String
X=96
Y=8
W=12
H=18
FontFace=#FontFace#
FontSize=11
FontColor=#MutedColor#
StringAlign=Center
Text=X
AntiAlias=1
LeftMouseUpAction=[!DeactivateConfig "DevMatrixDashboard\QuickLauncher"]

; ==========================================
; ÁREA DOS ATALHOS
; ==========================================

[MeterVSCode]
Meter=Image
ImageName=#ROOTCONFIGPATH#@Resources\Images\Icons\vscode.png
X=#IconX#
Y=44
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
ToolTipText=Visual Studio Code
LeftMouseUpAction=["#VSCodePath#"]

[MeterPostman]
Meter=Image
ImageName=#ROOTCONFIGPATH#@Resources\Images\Icons\postman.png
X=#IconX#
Y=88
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
ToolTipText=Postman
LeftMouseUpAction=["#PostmanPath#"]

[MeterOBS]
Meter=Image
ImageName=#ROOTCONFIGPATH#@Resources\Images\Icons\obs.png
X=#IconX#
Y=132
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
ToolTipText=OBS Studio
LeftMouseUpAction=["#OBSPath#"]

[MeterCalculator]
Meter=Image
ImageName=#ROOTCONFIGPATH#@Resources\Images\Icons\calculator.png
X=#IconX#
Y=176
W=#IconSize#
H=#IconSize#
PreserveAspectRatio=1
ToolTipText=Calculadora
LeftMouseUpAction=["#CalculatorPath#"]
