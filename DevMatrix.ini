[Rainmeter]

Update=1000
AccurateText=1
DynamicWindowSize=1

BackgroundMode=1
SolidColor=0,0,0,0

@include=#@#Variables.inc
@include2=#@#Styles.inc


; =========================================================
; MEDIDAS
; =========================================================

[MeasureTime]

Measure=Time
Format=%H:%M:%S


[MeasureDate]

Measure=Time
Format=%A, %d/%m/%Y


[MeasureCPU]

Measure=CPU


[MeasureRAM]

Measure=PhysicalMemory


[MeasureDiskC]

Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1
UpdateDivider=10


[MeasureTotalDiskC]

Measure=FreeDiskSpace
Drive=C:
Total=1
UpdateDivider=10


[MeasureDiskD]

Measure=FreeDiskSpace
Drive=D:
InvertMeasure=1
UpdateDivider=10


[MeasureTotalDiskD]

Measure=FreeDiskSpace
Drive=D:
Total=1
UpdateDivider=10


; =========================================================
; PAINEL PRINCIPAL
; =========================================================

[MeterBackground]

Meter=Shape

Shape=Rectangle 0,0,300,650,8 | Fill Color #PanelBackground# | StrokeWidth 1 | Stroke Color #PanelBorder#


; =========================================================
; CABEÇALHO
; =========================================================

[MeterClockBackground]

Meter=Shape

X=0
Y=0

Shape=Rectangle 0,0,300,78,8 | Fill Color 25,30,28,220 | StrokeWidth 0


; =========================================================
; RELÓGIO
; =========================================================

[MeterTime]

Meter=String

MeterStyle=StyleTitle

MeasureName=MeasureTime

X=150
Y=12

Text=%1

StringAlign=Center

FontSize=28


[MeterDate]

Meter=String

MeterStyle=StyleDate

MeasureName=MeasureDate

X=150
Y=48

Text=%1

StringAlign=Center

FontColor=255,255,255,255


